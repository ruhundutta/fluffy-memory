<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolkata Municipal Corporation - Civic Identity Proposal</title>
    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-ivory: #FDFBF7;
            --text-main: #2A2A2A;
            --text-muted: #5A5A5A;
            --line-color: rgba(42, 42, 42, 0.15);
            
            /* Civic Palette */
            --civic-crimson: #9B2226;
            --civic-teal: #0A7273;
            --civic-gold: #C29B4C;
            --civic-navy: #16264C;
            
            /* Fonts */
            --font-title: 'Cinzel', serif;
            --font-bengali: 'Tiro Bangla', serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-ivory);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(194, 155, 76, 0.03) 0%, transparent 60%);
        }

        /* Typography */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Tiro+Bangla&family=Space+Mono&display=swap');

        h1, h2, h3, .title-font { font-family: var(--font-title); }
        .bengali-font { font-family: var(--font-bengali); }
        
        /* Layout Grid */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 4vw;
            position: relative;
            z-index: 2;
        }

        .board-divider {
            height: 1px;
            background: var(--line-color);
            margin: 3rem 0;
            width: 100%;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--text-main);
            animation: fadeInDown 1s ease-out;
        }

        .header-left {
            max-width: 700px;
        }

        .bengali-title {
            font-size: 2.5rem;
            color: var(--civic-crimson);
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .english-title {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .header-right {
            text-align: right;
        }

        .motto {
            font-size: 1.25rem;
            color: var(--civic-teal);
            margin-bottom: 0.5rem;
        }

        .est-badge {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        /* Top Annotation */
        .annotation-bar {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 1rem 0;
            color: var(--text-muted);
        }

        /* Emblem Showcase */
        .emblem-showcase {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4rem;
            text-align: center;
            margin: 4rem 0;
        }

        .emblem-card {
            animation: fadeInUp 1s ease-out backwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .emblem-card:nth-child(1) { animation-delay: 0.2s; }
        .emblem-card:nth-child(2) { animation-delay: 0.4s; }
        .emblem-card:nth-child(3) { animation-delay: 0.6s; }

        .svg-container {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
            transition: transform 0.5s ease;
        }

        .svg-container:hover svg {
            transform: scale(1.03);
        }

        .emblem-label {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        /* Motive Behind Motif */
        .motive-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 4rem;
            padding: 4rem 0;
            border-top: 1px solid var(--line-color);
            border-bottom: 1px solid var(--line-color);
        }

        .motive-title {
            font-size: 1.5rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .motive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .motive-item h4 {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--civic-navy);
            margin-bottom: 0.75rem;
        }

        .motive-item p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Mockup Grid - Architecture Presentation Style */
        .mockup-section {
            margin: 4rem 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 350px);
            gap: 20px;
        }

        .mockup {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }

        .mockup-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mockup:hover .mockup-overlay { opacity: 1; }

        /* Specific Mockup Styles (CSS Generated to avoid broken images) */
        .mockup-flag {
            grid-column: span 2;
            grid-row: span 2;
            background: linear-gradient(135deg, #7A1A1E 0%, #B8252A 50%, #9B2226 100%);
            position: relative;
        }
        
        .mockup-flag::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 100px,
                rgba(255,255,255,0.05) 100px,
                rgba(255,255,255,0.05) 200px
            );
            mask-image: radial-gradient(circle, white, transparent);
            -webkit-mask-image: radial-gradient(circle, white, transparent);
        }

        .mockup-building {
            grid-column: span 1;
            grid-row: span 2;
            background: #e0ddd3;
            background-image: 
                linear-gradient(to right, #d4d0c5 20%, transparent 20%),
                linear-gradient(to bottom, #d4d0c5 5%, transparent 5%);
            background-size: 40px 100%, 100% 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-hang {
            width: 40px;
            height: 250px;
            background: var(--civic-crimson);
            box-shadow: 2px 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .mockup-stage {
            grid-column: span 1;
            grid-row: span 1;
            background: radial-gradient(circle at center, #3A1012, #180506);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 20px solid #C29B4C;
        }

        .mockup-folder {
            grid-column: span 1;
            grid-row: span 1;
            background: #111B33;
            box-shadow: inset -10px -10px 40px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 4px solid #090e1f;
        }

        /* SVG Components */
        .foil-gold { fill: #D4AF37; }
        .foil-silver { fill: #E0E0E0; }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            opacity: 0.02;
            pointer-events: none;
            z-index: 1;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .emblem-showcase { gap: 2rem; }
            .mockup-section {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }
            .mockup-stage, .mockup-folder { grid-column: span 1; height: 350px;}
        }
        @media (max-width: 900px) {
            .header { flex-direction: column; align-items: flex-start; gap: 2rem; }
            .header-right { text-align: left; }
            .emblem-showcase { grid-template-columns: 1fr; gap: 4rem; }
            .motive-section { grid-template-columns: 1fr; }
            .mockup-section { grid-template-columns: 1fr; }
            .mockup-flag, .mockup-building, .mockup-stage, .mockup-folder { grid-column: span 1; grid-row: span 1; height: 300px; }
        }
    </style>
</head>
